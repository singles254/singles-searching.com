      // ==========================================
      // NORMALIZE PHONE NUMBERS
      // ==========================================

      function normalizePhone(phone) {
        let number = String(phone)
          .replace(/O/g, "0")
          .replace(/o/g, "0")
          .replace(/\D/g, "");

        // Kenyan number beginning with 0
        if (number.startsWith("0")) {
          return "254" + number.substring(1);
        }

        // Kenyan number beginning with 254
        if (number.startsWith("254")) {
          return number;
        }

        // 9-digit Kenyan number
        if (number.length === 9 && number.startsWith("7")) {
          return "254" + number;
        }

        // Keep foreign numbers as they are
        return number;
      }

      // ==========================================
      // REMOVE DUPLICATES
      // ==========================================

      const seenPhones = new Set();
      const seenProfiles = new Set();

      profiles.forEach((profile) => {
        const phoneKey = normalizePhone(profile.phone);

        const profileKey =
          profile.name.toLowerCase().trim() +
          "|" +
          profile.age.toLowerCase().trim() +
          "|" +
          profile.location.toLowerCase().trim();

        // Duplicate phone number
        if (seenPhones.has(phoneKey)) {
          return;
        }

        // Duplicate name + age + location
        if (seenProfiles.has(profileKey)) {
          return;
        }

        seenPhones.add(phoneKey);
        seenProfiles.add(profileKey);

        uniqueProfiles.push(profile);
      });
